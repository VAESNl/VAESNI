<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vaesni - Kayıt Ol</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #15151c;
      border: 1px solid #292933;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9999a6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      color: #d7d7df;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #33333f;
      border-radius: 10px;
      background: #0f0f14;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #7c5cff;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #7c5cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Vaesni</div>

    <div class="subtitle">
      Hesabını oluştur
    </div>

    <form id="signup-form">

      <label for="username">Kullanıcı adı</label>

      <input
        type="text"
        id="username"
        placeholder="Kullanıcı adın"
        required
      >

      <label for="email">E-posta</label>

      <input
        type="email"
        id="email"
        placeholder="ornek@mail.com"
        required
      >

      <label for="password">Şifre</label>

      <input
        type="password"
        id="password"
        placeholder="Şifren"
        minlength="6"
        required
      >

      <button
        type="submit"
        id="signup-button"
      >
        Kayıt Ol
      </button>

    </form>

    <div id="message"></div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // ==============================
    // SUPABASE AYARLARI
    // ==============================

    const SUPABASE_URL =
      "https://aylitbspehzmluunwnrx.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_m67SK-0omCT__5qOHaiHYg_FDt5lzhz";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // HTML ELEMANLARI
    // ==============================

    const form =
      document.getElementById("signup-form");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("signup-button");


    // ==============================
    // KAYIT İŞLEMİ
    // ==============================

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const username =
          document
            .getElementById("username")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        if (!username || !email || !password) {

          message.textContent =
            "Lütfen tüm alanları doldur.";

          return;
        }


        button.disabled = true;

        message.textContent =
          "Hesap oluşturuluyor...";


        // ==============================
        // SUPABASE AUTH KULLANICISI
        // ==============================

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password

          });


        if (error) {

          message.textContent =
            "Hata: " + error.message;

          button.disabled = false;

          return;
        }


        // ==============================
        // USERS TABLOSUNA KAYDET
        // ==============================

        if (data.user) {

          const {
            error: profileError
          } =
            await supabaseClient
              .from("users")
              .insert({

                id: data.user.id,

                username: username,

                email: email

              });


          if (profileError) {

            message.textContent =
              "Profil oluşturulamadı: "
              + profileError.message;

            button.disabled = false;

            return;
          }
        }


        // ==============================
        // BAŞARILI
        // ==============================

        message.textContent =
          "Kayıt başarılı! 🎉";

        form.reset();

        button.disabled = false;

      }

    );

  </script>

</body>
</html>
