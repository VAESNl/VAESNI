<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaesni</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #0b0d12;
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* ÜST BAR */
.topbar {
    height: 60px;
    background: #11141c;
    display: flex;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid #222632;
}

.logo {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 1px;
}

.logo span {
    color: #7c5cff;
}

/* ANA ALAN */
.app {
    display: flex;
    height: calc(100vh - 60px);
}

/* SUNUCULAR */
.servers {
    width: 75px;
    background: #0e1016;
    border-right: 1px solid #20232d;
    padding-top: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

.server {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    background: #191d27;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.server:hover {
    background: #7c5cff;
    border-radius: 12px;
}

.server.add {
    color: #7c5cff;
    font-size: 25px;
}

/* KANALLAR */
.channels {
    width: 230px;
    background: #12151d;
    padding: 20px 15px;
    border-right: 1px solid #20232d;
}

.channels h3 {
    font-size: 14px;
    color: #888f9f;
    margin-bottom: 15px;
}

.channel {
    padding: 12px;
    border-radius: 8px;
    color: #aeb4c2;
    margin-bottom: 5px;
    cursor: pointer;
}

.channel:hover,
.channel.active {
    background: #202431;
    color: white;
}

/* SOHBET */
.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.chat-header {
    height: 60px;
    border-bottom: 1px solid #20232d;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: bold;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.message {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #7c5cff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.message-name {
    font-weight: bold;
    margin-bottom: 4px;
}

.message-text {
    color: #b7bdc9;
}

.input-area {
    padding: 15px;
    border-top: 1px solid #20232d;
}

.input-box {
    width: 100%;
    background: #1b1f29;
    border: none;
    outline: none;
    padding: 15px;
    border-radius: 10px;
    color: white;
    font-size: 15px;
}

/* SAĞ PANEL */
.members {
    width: 210px;
    background: #10131a;
    padding: 20px;
    border-left: 1px solid #20232d;
}

.members h3 {
    color: #858c9b;
    font-size: 13px;
    margin-bottom: 15px;
}

.member {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.status {
    width: 9px;
    height: 9px;
    background: #35d07f;
    border-radius: 50%;
}

/* MOBİL */
.mobile-nav {
    display: none;
}

@media(max-width: 800px) {

    .servers {
        display: none;
    }

    .channels {
        display: none;
    }

    .members {
        display: none;
    }

    .topbar {
        height: 58px;
    }

    .app {
        height: calc(100vh - 58px);
    }

    .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 65px;
        background: #11141c;
        border-top: 1px solid #252936;
        justify-content: space-around;
        align-items: center;
        z-index: 10;
    }

    .mobile-nav button {
        background: none;
        border: none;
        color: #8d94a3;
        font-size: 23px;
    }

    .mobile-nav button.active {
        color: #7c5cff;
    }

    .messages {
        padding-bottom: 90px;
    }

    .input-area {
        padding-bottom: 75px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="logo">V<span>aesni</span></div>
</header>

<div class="app">

    <aside class="servers">
        <div class="server">V</div>
        <div class="server">🎮</div>
        <div class="server">🎵</div>
        <div class="server add">+</div>
    </aside>

    <aside class="channels">
        <h3>VAESNI SUNUCUSU</h3>

        <div class="channel active"># genel</div>
        <div class="channel"># sohbet</div>
        <div class="channel"># oyun</div>
        <div class="channel"># müzik</div>
    </aside>

    <main class="chat">

        <div class="chat-header">
            # genel
        </div>

        <div class="messages">

            <div class="message">
                <div class="avatar">V</div>

                <div>
                    <div class="message-name">
                        Vaesni
                    </div>

                    <div class="message-text">
                        Vaesni'ye hoş geldin! 🚀
                    </div>
                </div>
            </div>

            <div class="message">
                <div class="avatar">O</div>

                <div>
                    <div class="message-name">
                        Oğuz
                    </div>

                    <div class="message-text">
                        Burası bizim yeni topluluğumuz.
                    </div>
                </div>
            </div>

        </div>

        <div class="input-area">
            <input
                class="input-box"
                placeholder="# genel kanalına mesaj gönder..."
            >
        </div>

    </main>

    <aside class="members">

        <h3>ÇEVRİMİÇİ — 2</h3>

        <div class="member">
            <div class="avatar">V</div>
            Vaesni
            <div class="status"></div>
        </div>

        <div class="member">
            <div class="avatar">O</div>
            Oğuz
            <div class="status"></div>
        </div>

    </aside>

</div>

<nav class="mobile-nav">
    <button class="active">💬</button>
    <button>🔍</button>
    <button>➕</button>
    <button>👤</button>
</nav>

</body>
</html>
